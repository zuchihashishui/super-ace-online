server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:ace}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=8KB
server.max-http-request-header-size=16KB
spring.threads.virtual.enabled=true
ace.secure-cookie=${COOKIE_SECURE:false}
ace.public-origin=${PUBLIC_ORIGIN:}
ace.spin-cooldown-ms=${SPIN_COOLDOWN_MS:250}
ace.creator-user=${CREATOR_USER:zuchiha}
ace.creator-password=${CREATOR_PASSWORD:112357}
ace.jobs-enabled=${JOBS_ENABLED:true}
ace.zone=${REPORT_ZONE:Asia/Ho_Chi_Minh}

spring.task.scheduling.pool.size=2

ace.jwt-secret=${JWT_SECRET:}
