services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ace
      MYSQL_USER: ace
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -uace -h127.0.0.1 -Dace -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/ace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: ace
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      CREATOR_USER: ${CREATOR_USER:-zuchiha}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD:-112357}
      REPORT_ZONE: ${REPORT_ZONE:-Asia/Ho_Chi_Minh}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
