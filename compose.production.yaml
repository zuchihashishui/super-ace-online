# Standalone HTTPS deployment: docker compose -f compose.production.yaml up -d --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ace
      MYSQL_USER: ace
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -uace -h127.0.0.1 -Dace -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/ace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: ace
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      CREATOR_USER: ${CREATOR_USER:-zuchiha}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD:-112357}
      REPORT_ZONE: ${REPORT_ZONE:-Asia/Manila}
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to https://your-domain}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  mysql-data:
  caddy-data:
  caddy-config:
